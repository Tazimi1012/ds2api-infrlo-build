name: Build DS2API for Infrlo

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ds2api-infrlo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download the reviewed source commit
        uses: actions/checkout@v4
        with:
          repository: Tazimi1012/ds2api
          ref: 8316cf8a0352e900e03ce600b792083f590d80e2
          persist-credentials: false

      - name: Choose image name and optimize cross-platform build
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/ds2api-infrlo" >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "8316cf8a0352e900e03ce600b792083f590d80e2"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Dockerfile')
          s = p.read_text()
          changes = {
              'FROM node:24 AS webui-builder': 'FROM --platform=$BUILDPLATFORM node:24 AS webui-builder',
              'FROM golang:1.26 AS go-builder': 'FROM --platform=$BUILDPLATFORM golang:1.26 AS go-builder',
          }
          for before, after in changes.items():
              if s.count(before) != 1:
                  raise SystemExit('Unexpected Dockerfile: stop and review before building.')
              s = s.replace(before, after)
          p.write_text(s)
          PY

      - name: Enable ARM64 image building
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the runtime image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime-from-source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=8316cf8a0352e900e03ce600b792083f590d80e2
            org.opencontainers.image.version=4.6.1-infrlo
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test without a DeepSeek account
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          ref="${IMAGE}@${DIGEST}"
          docker pull "$ref"
          trap 'docker logs --tail=60 ds2api-smoke 2>/dev/null || true; docker rm -f ds2api-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name ds2api-smoke \
            --memory=384m --cpus=1 \
            --publish 127.0.0.1:18501:5001 \
            --env PORT=5001 \
            --env GOMEMLIMIT=256MiB \
            --env DS2API_ADMIN_KEY=ci-smoke-only-not-a-deployment-secret \
            --env DS2API_JWT_SECRET=ci-smoke-only-not-a-deployment-jwt-secret \
            --env 'DS2API_CONFIG_JSON={"keys":["ci-smoke-only-api-key"],"accounts":[]}' \
            --env DS2API_ENV_WRITEBACK=0 \
            "$ref"
          curl --fail --show-error --retry 20 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 5 http://127.0.0.1:18501/healthz
          curl --fail --show-error --max-time 10 http://127.0.0.1:18501/admin -o /dev/null
          curl --fail --show-error --max-time 10 http://127.0.0.1:18501/v1/models -o /dev/null
          {
            echo '### Startup smoke test (no real account or chat test)'
            echo 'The amd64 image started with a 384 MB container limit. This does not prove live chat will fit.'
            echo '```text'
            docker stats --no-stream --format 'Memory: {{.MemUsage}}; CPU: {{.CPUPerc}}' ds2api-smoke
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate ready-to-upload Infrlo deployment files
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p infrlo-deploy-files
          printf 'FROM %s@%s\n' "$IMAGE" "$DIGEST" > infrlo-deploy-files/Dockerfile
          printf '*\n!Dockerfile\n!.dockerignore\n' > infrlo-deploy-files/.dockerignore
          printf 'Runtime-only deployment. No account, API key, or password belongs in this repository.\n' > infrlo-deploy-files/README.md
          {
            echo '## Your Infrlo deployment image'
            echo '### Image reference (for an image-source deployment)'
            echo '```text'
            printf '%s@%s\n' "$IMAGE" "$DIGEST"
            echo '```'
            echo '### Dockerfile (for a GitHub-repository deployment)'
            echo '```dockerfile'
            cat infrlo-deploy-files/Dockerfile
            echo '```'
            echo "Image tag: ${IMAGE}:${TAG}"
            echo ''
            echo 'IMPORTANT: Set the GHCR package visibility to Public before Infrlo pulls it.'
            echo 'IMPORTANT: Real DeepSeek credentials belong ONLY in Infrlo runtime secrets.'
            echo 'Download the infrlo-deploy-files artifact, or copy the Dockerfile above.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment files
        uses: actions/upload-artifact@v4
        with:
          name: infrlo-deploy-files
          path: infrlo-deploy-files/
          include-hidden-files: true
          retention-days: 7
